<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Card -->
    <div class="card">
        <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-img">

        <h1 class="name">John Doe</h1>
        <p class="role">Frontend Developer</p>
        
        <p class="bio">
            Passionate about creating clean, user‑friendly web experiences.
            Learning HTML & CSS to build awesome websites!
        </p>

        <div class="links">
            <a href="#" class="btn">LinkedIn</a>
            <a href="#" class="btn">GitHub</a>
        </div>
    </div>
</body>
</html>
